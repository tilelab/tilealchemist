name: TileAlchemist pipeline (reusable)

# Builds one or more profiles' world-covering PMTiles layers. prepare-shards
# walks the source archive once. build-shards runs every profile's per-tile
# transform against the same fetched bytes, across `worker_count` parallel
# workers. merge joins each profile's shards into its own .pmtiles file.
#
# This workflow MUST publish nowhere: no GitHub Release, no B2 upload. That
# is the calling workflow's job. Every caller is a separate repository (see
# tilelab/tilealchemist-standardprofiles) calling this via
# `uses: tilelab/tilealchemist/.github/workflows/_pipeline.yml@<ref>`.
#
# Profiles arrive as an artifact the caller uploads, never from a checkout
# done here. This pipeline has no opinion about which repository a profile
# lives in, or whether it was committed to one at all. See
# docs/ARCHITECTURE.md "Getting the profiles in".
#
# docs/ARCHITECTURE.md "Publishing" has the rest of the reusable-workflow
# contract: the `<output_basename>-pmtiles` artifact-name interface, why
# nothing is published from here, and why every job below checks out
# tilealchemist by name instead of finding it in the workspace.
# "Fetching"/"Parallelism" say why one fetch per worker covers every profile.

on:
  workflow_call:
    inputs:
      profile:
        description: 'Path(s) to a profile''s .py file to apply, resolved inside the unpacked profile_artifact (any dependency it declares in its own inline PEP 723 block is installed automatically): one value, or a comma-separated list matched 1:1 with output_basename, e.g. "./my_profile.py" or "./land.py,./cropped_waterways.py".'
        required: true
        type: string
      profile_artifact:
        description: 'Name of an artifact the calling workflow uploaded before calling this one, holding every .py file `profile` names. Unpacked into the workspace root, so a profile stored at your repository root is reached as "./my_profile.py" either way.'
        required: true
        type: string
      source:
        description: 'tilealchemist.sources entry to resolve the PMTiles archive from.'
        required: false
        type: string
        default: "openfreemap"
      source_url:
        description: 'PMTiles URL to use; required when source is "static-url".'
        required: false
        type: string
        default: ""
      schema:
        description: 'tilealchemist.schemas entry naming how the source archive''s layers are structured ("openmaptiles", "protomaps"). Required when source is "static-url" and not accepted otherwise: every other source names the schema its provider publishes. A profile never names a schema at all; it asks for feature sets whichever schema answers (see docs/PROFILES.md).'
        required: false
        type: string
        default: ""
      artifact_namespace:
        description: 'Name to prefix this call''s own internal artifacts with (shard manifests, per-worker shards) -- pass "name", not "name-", the separator is added here. Only needed when one workflow run calls this pipeline more than once, since two calls would otherwise upload the same artifact names; namespacing the second is enough, an unnamespaced call''s names being no prefix of a namespaced one''s. The published `<output_basename>-pmtiles` artifacts are unaffected, their names being unique already.'
        required: false
        type: string
        default: ""
      min_zoom:
        required: false
        type: string
        default: "0"
      max_zoom:
        required: false
        type: string
        default: "14"
      worker_count:
        description: "How many parallel shard-building jobs to fan out into (1-256, GitHub's matrix limit), or \"auto\" to let prepare-shards pick the smallest multiple of the concurrency whose worst worker stays inside every budget. Higher isn't necessarily faster: GitHub queues more than ~20 concurrently running jobs on a public repo, so it mainly trades job count for job size (see docs/ARCHITECTURE.md \"Parallelism\" and \"Sizing a run\")."
        required: false
        type: string
        default: "128"
      output_basename:
        description: "Base name for each profile's output .pmtiles file and artifact: one value, or a comma-separated list matched 1:1 with profile, e.g. \"land\" or \"land,cropped-waterways\"."
        required: true
        type: string
      attribution:
        description: "What the built layers credit, as a template in which \"{source}\" stands for the attribution the source archive declares for itself, e.g. \"<a href=\\\"https://example.org\\\">&copy; Example</a> {source}\". Left off, the archive's own attribution is carried through unchanged; given without the placeholder, it replaces it outright. See docs/ARCHITECTURE.md \"Source attribution\"."
        required: false
        type: string
        default: ""

jobs:
  prepare-shards:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.gen-workers.outputs.workers }}
      profile_pairs: ${{ steps.gen-pairs.outputs.profile_pairs }}
      attribution: ${{ steps.walk.outputs.attribution }}
    steps:
      - name: Validate profile/output_basename line up 1:1
        env:
          PROFILE: ${{ inputs.profile }}
          OUTPUT_BASENAME: ${{ inputs.output_basename }}
        run: |
          IFS=',' read -ra PROFILE_ENTRIES <<< "$PROFILE"
          IFS=',' read -ra BASENAME_ENTRIES <<< "$OUTPUT_BASENAME"
          if [ "${#PROFILE_ENTRIES[@]}" -ne "${#BASENAME_ENTRIES[@]}" ]; then
            echo "::error::profile has ${#PROFILE_ENTRIES[@]} entries but output_basename has ${#BASENAME_ENTRIES[@]}; must match 1:1"
            exit 1
          fi

      # Both are empty on GitHub Enterprise Server, where an empty `ref`
      # would silently check the default branch out instead. Asserted in the
      # run's first job rather than in all three; see docs/ARCHITECTURE.md
      # "Getting the profiles in".
      - name: Validate the tilealchemist checkout resolves
        env:
          TILEALCHEMIST_REPOSITORY: ${{ job.workflow_repository }}
          TILEALCHEMIST_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$TILEALCHEMIST_REPOSITORY" ] || [ -z "$TILEALCHEMIST_SHA" ]; then
            echo "::error::job.workflow_repository/job.workflow_sha are empty (they are not available on GitHub Enterprise Server), so the tilealchemist checkouts below can't be resolved"
            exit 1
          fi
          echo "tilealchemist: ${TILEALCHEMIST_REPOSITORY}@${TILEALCHEMIST_SHA}"

      # This job runs no profile. It downloads them only so a path missing
      # from the artifact fails here, in seconds, instead of identically in
      # every one of `worker_count` build-shards cells after the archive walk
      # has already run.
      - name: Download the caller's profiles
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.profile_artifact }}
          path: profiles

      - name: Validate every profile path is in the artifact
        env:
          PROFILE: ${{ inputs.profile }}
          PROFILE_ARTIFACT: ${{ inputs.profile_artifact }}
        run: |
          IFS=',' read -ra PROFILE_ENTRIES <<< "$PROFILE"
          for PROFILE_PATH in "${PROFILE_ENTRIES[@]}"; do
            if [ ! -f "profiles/$PROFILE_PATH" ]; then
              echo "::error::profile '$PROFILE_PATH' is not in the '$PROFILE_ARTIFACT' artifact; it holds: $(cd profiles && find . -name '*.py' | sort | tr '\n' ' ')"
              exit 1
            fi
          done

      # tilealchemist alone. No caller repository is ever checked out here.
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tilealchemist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tilealchemist
        run: pip install ./.tilealchemist

      - id: walk
        name: Walk archive directory and partition into per-worker manifests
        env:
          MIN_ZOOM: ${{ inputs.min_zoom }}
          MAX_ZOOM: ${{ inputs.max_zoom }}
          SOURCE: ${{ inputs.source }}
          SOURCE_URL: ${{ inputs.source_url }}
          SCHEMA: ${{ inputs.schema }}
          WORKER_COUNT: ${{ inputs.worker_count }}
          ATTRIBUTION: ${{ inputs.attribution }}
        run: |
          ARGS=(--worker-count "$WORKER_COUNT" --min-zoom "$MIN_ZOOM" --max-zoom "$MAX_ZOOM" --source "$SOURCE" --out-dir manifests)
          if [ -n "$SOURCE_URL" ]; then
            ARGS+=(--source-url "$SOURCE_URL")
          fi
          if [ -n "$SCHEMA" ]; then
            ARGS+=(--schema "$SCHEMA")
          fi
          if [ -n "$ATTRIBUTION" ]; then
            ARGS+=(--attribution "$ATTRIBUTION")
          fi
          # stdout is the layer attribution the merge job stamps in; the run's
          # log lines go to stderr and pass straight through. The template is
          # filled in there rather than here because `${v//p/r}` expands an
          # unescaped `&` in the replacement to the match, and both sources'
          # attributions are full of `&copy;`.
          LAYER_ATTRIBUTION=$(tilealchemist-prepare-shards "${ARGS[@]}")
          echo "attribution=$LAYER_ATTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "$LAYER_ATTRIBUTION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_namespace && format('{0}-', inputs.artifact_namespace) || '' }}shard-manifests
          path: manifests

      # Counted from the manifests, not from the input: `worker_count: auto`
      # lets prepare-shards choose, and the manifests it wrote are then the
      # only truth about how many there are. The 256 check is GitHub's own
      # matrix limit, which it would otherwise report as an unhelpful error
      # after the whole archive walk has already run.
      - id: gen-workers
        name: Generate worker index matrix
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import glob, json, sys
          count = len(glob.glob("manifests/worker-*.bin"))
          if not 1 <= count <= 256:
              sys.exit(f"::error::prepare-shards wrote {count} manifests; a GitHub Actions "
                       f"matrix expands to at most 256 cells")
          print(f"workers={json.dumps(list(range(count)))}")
          PY

      - id: gen-pairs
        name: Generate profile/output-basename pairs
        env:
          PROFILE: ${{ inputs.profile }}
          OUTPUT_BASENAME: ${{ inputs.output_basename }}
        run: |
          echo "profile_pairs=$(python3 -c '
          import json, os
          profiles = os.environ["PROFILE"].split(",")
          basenames = os.environ["OUTPUT_BASENAME"].split(",")
          print(json.dumps([{"profile": p, "output_basename": b} for p, b in zip(profiles, basenames)]))
          ')" >> "$GITHUB_OUTPUT"

  build-shards:
    needs: prepare-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare-shards.outputs.workers) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tilealchemist

      # The only job that needs a profile. It takes it from the caller's
      # artifact rather than checking the caller's repository out, so a
      # profile can come from anywhere the calling workflow can produce a
      # file. Unpacked at the workspace root, so the paths in `profile` read
      # the same as a repo-relative path would.
      - name: Download the caller's profiles
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.profile_artifact }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A profile's own dependencies come from the PEP 723 block inside its
      # .py file, read without importing it: importing would need those very
      # dependencies first. See docs/PROFILES.md ("Writing and distributing
      # your own profile") and profile_requirements.py.
      - name: Install tilealchemist and every profile's own dependencies
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          pip install ./.tilealchemist

          REQUIREMENTS="$RUNNER_TEMP/profile-requirements.txt"
          IFS=',' read -ra PROFILE_ENTRIES <<< "$PROFILE"
          for PROFILE_PATH in "${PROFILE_ENTRIES[@]}"; do
            tilealchemist-profile-requirements "$PROFILE_PATH" > "$REQUIREMENTS"
            if [ -s "$REQUIREMENTS" ]; then
              pip install -r "$REQUIREMENTS"
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_namespace && format('{0}-', inputs.artifact_namespace) || '' }}shard-manifests
          path: manifests

      - name: "Build this worker's tile shard(s)"
        env:
          PROFILE: ${{ inputs.profile }}
          OUTPUT_BASENAME: ${{ inputs.output_basename }}
          WORKER: ${{ matrix.worker }}
        run: |
          WORKER_ID=$(printf '%03d' "$WORKER")
          IFS=',' read -ra BASENAMES <<< "$OUTPUT_BASENAME"
          OUT_PATHS=()
          for BASENAME in "${BASENAMES[@]}"; do
            OUT_PATHS+=("${BASENAME}-shard-${WORKER}.mbtiles")
          done
          OUT_JOINED=$(IFS=,; echo "${OUT_PATHS[*]}")
          tilealchemist-build-shard \
            --worker-index "$WORKER" \
            --profile "$PROFILE" \
            --manifest "manifests/worker-${WORKER_ID}.bin" \
            --source manifests/source.json \
            --out "$OUT_JOINED"

      # A missing file is expected, not a failure. One artifact per worker
      # cannot collide across profiles; see docs/ARCHITECTURE.md "Worker
      # independence".
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact_namespace && format('{0}-', inputs.artifact_namespace) || '' }}shards-${{ matrix.worker }}
          path: "*-shard-${{ matrix.worker }}.mbtiles"
          if-no-files-found: ignore

  merge:
    needs: [prepare-shards, build-shards]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJson(needs.prepare-shards.outputs.profile_pairs) }}
    steps:
      # tilealchemist alone, only for throttle_progress.sh below.
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .tilealchemist

      # Every cell downloads every profile's shards and uses only its own,
      # by the filename prefix below. See docs/ARCHITECTURE.md "Publishing".
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_namespace && format('{0}-', inputs.artifact_namespace) || '' }}shards-*
          path: shards
          merge-multiple: true

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe || {
            git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
            make -C /tmp/tippecanoe -j"$(nproc)"
            sudo make -C /tmp/tippecanoe install
          }

      # tile-join rewrites a `z/x/y` progress line in place with \r.
      # Throttled for the same reason as the worker logs (see README).
      # Warnings and errors pass straight through.
      - name: Merge this profile's shards into its final layer
        env:
          ATTRIBUTION: ${{ needs.prepare-shards.outputs.attribution }}
          OUTPUT_BASENAME: ${{ matrix.pair.output_basename }}
        run: |
          if [ -z "$ATTRIBUTION" ]; then
            echo "::error::no attribution for ${OUTPUT_BASENAME}; a layer MUST NOT be published without one"
            exit 1
          fi
          tile-join --no-tile-size-limit \
            --attribution="$ATTRIBUTION" \
            -o "${OUTPUT_BASENAME}.pmtiles" shards/"${OUTPUT_BASENAME}"-shard-*.mbtiles 2>&1 \
            | .tilealchemist/tilealchemist/throttle_progress.sh 60

      - name: Summarize
        env:
          OUTPUT_BASENAME: ${{ matrix.pair.output_basename }}
          PROFILE: ${{ matrix.pair.profile }}
          MIN_ZOOM: ${{ inputs.min_zoom }}
          MAX_ZOOM: ${{ inputs.max_zoom }}
          WORKER_COUNT: ${{ inputs.worker_count }}
        run: |
          SHARD_COUNT=$(find shards -name "${OUTPUT_BASENAME}-shard-*.mbtiles" | wc -l | tr -d ' ')
          SIZE=$(du -h "${OUTPUT_BASENAME}.pmtiles" | cut -f1)
          {
            echo "### ${OUTPUT_BASENAME} layer"
            echo "- profile: ${PROFILE}"
            echo "- min_zoom: ${MIN_ZOOM}"
            echo "- max_zoom: ${MAX_ZOOM}"
            echo "- non-empty shards merged: $SHARD_COUNT / $WORKER_COUNT"
            echo "- output size: $SIZE"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pair.output_basename }}-pmtiles
          path: ${{ matrix.pair.output_basename }}.pmtiles
