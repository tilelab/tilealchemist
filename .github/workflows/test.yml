name: Test

# Calls the real _pipeline.yml with the real shipped profiles, rather than a
# hand-rolled shell replica of its steps: a replica drifts the moment
# _pipeline.yml changes, and nothing here would catch it.
#
# It runs against real OpenFreeMap data on purpose. Real OSM geometry turns
# up the GEOS edge cases a water profile has to survive; hand-built polygons
# do not. worker_count 1 and a low max_zoom keep that to one shard and about
# a minute instead of a multi-hour production run, and prepare-shards
# downloads only the part of the archive's directory index the zoom range
# needs (see pmtiles_index.py) -- tens of kilobytes, not the archive's full
# ~96 MB.
#
# It runs twice, once per source/schema pair the repository ships, because
# the two differ in more than a URL: a Protomaps build lays its directory
# index out the other way round (leaf directories after the tile data) and
# names and structures its layers differently (see ProtomapsSchema). Only a
# real run against each catches a regression in either.

on:
  push:
  pull_request:

jobs:
  # The profiles come from another repository, which is why this works.
  # _pipeline.yml takes them as an artifact and never checks a caller's
  # repository out (docs/ARCHITECTURE.md "Getting the profiles in"), so
  # tilealchemist, shipping no profiles of its own, can hand it somebody
  # else's. Deliberately unpinned: run against that repo's current main, a
  # profile that breaks over there shows up here, and the failing step says
  # which of the two it was.
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tilelab/tilealchemist-standardprofiles
          ref: main

      - uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: "*.py"

  # Both profiles in one call, the shape a production run uses: one
  # prepare-shards walk and one fetch per worker, shared between them.
  pipeline-openfreemap:
    needs: profiles
    uses: ./.github/workflows/_pipeline.yml
    with:
      profile: ./land.py,./cropped_waterways.py
      profile_artifact: profiles
      output_basename: land,cropped-waterways
      min_zoom: "0"
      # The whole world, capped low. Tile data roughly triples per extra zoom
      # level, so this is the one knob that makes the run meaningfully more
      # expensive.
      max_zoom: "4"
      worker_count: "1"
      # No `attribution:`: this call covers the inherited path, where each
      # layer carries what its source archive declares for itself.

  # The same world and zoom range, read through the other source and schema.
  # Proves ProtomapsSource picks a build out of the daily index, and that
  # ProtomapsSchema finds water in what comes back.
  #
  # `land` alone, where the OpenFreeMap call runs both profiles, because
  # Protomaps encodes no waterway lines this far out: rivers appear at z9,
  # canals and streams at z11 and up. Pairing `cropped_waterways.py` here
  # would assert tiles out of a layer that is correctly empty, and covering
  # it honestly would mean a z9 run -- ~1 GB of tile data against this one's
  # ~6 MB, no longer a per-push test.
  pipeline-protomaps:
    needs: profiles
    uses: ./.github/workflows/_pipeline.yml
    with:
      profile: ./land.py
      profile_artifact: profiles
      output_basename: land-protomaps
      # No `schema:` anywhere here. ProtomapsSource names its own, which is
      # the point of picking a source at all.
      source: protomaps
      min_zoom: "0"
      max_zoom: "4"
      worker_count: "1"
      # Both calls land in the same workflow run, and the pipeline names the
      # artifacts it hands between its own jobs per pipeline, not per call.
      # Namespacing this one is enough: the other's `shards-*` does not reach
      # into `protomaps-shards-*` (see _pipeline.yml's `artifact_namespace`).
      artifact_namespace: "protomaps"
      # Covers the other path: the input replacing the archive's own.
      attribution: "CI test run, not for real use"

  # A run that writes nothing still exits 0, so the pipeline succeeding above
  # does not cover the one failure that looks like success.
  check-tiles:
    needs: [pipeline-openfreemap, pipeline-protomaps]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        output_basename: [land, cropped-waterways, land-protomaps]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.output_basename }}-pmtiles

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pmtiles

      - name: Check the run produced tiles
        # Through the environment, not `${{ }}` interpolation into the body.
        env:
          OUTPUT_BASENAME: ${{ matrix.output_basename }}
        run: |
          python3 - <<'PY'
          import os
          from pmtiles.reader import MmapSource, Reader

          path = os.environ["OUTPUT_BASENAME"] + ".pmtiles"
          with open(path, "rb") as f:
              header = Reader(MmapSource(f)).header()
          addressed = header["addressed_tiles_count"]
          contents = header["tile_contents_count"]
          print(f"{path}: {addressed} tiles, {contents} distinct contents")
          assert addressed > 0, f"no tiles written to {path}"
          # addressed is what a shard layout must never change; contents is what
          # deduplication moves, and can only ever be a subset of it.
          assert 0 < contents <= addressed, (
              f"{path}: {contents} distinct contents against {addressed} tiles")
          PY
