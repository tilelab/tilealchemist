name: Lint

on:
  push:
  pull_request:

jobs:
  # Google Python Style Guide, via its own pylintrc vendored as .pylintrc
  # (https://google.github.io/styleguide/pyguide.html).
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The package itself, so pylint resolves its imports rather than
      # reporting every third-party one as missing. pylint is pinned: a new
      # release adding a check should not fail an unrelated push.
      - run: pip install . pylint==4.1.2

      - name: Check Google Python style
        run: pylint tilealchemist
