name: Lint

on:
  push:
  pull_request:

jobs:
  doc-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check documentation style
        run: python3 lint/doc_style.py tilealchemist lint
